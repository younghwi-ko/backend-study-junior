spring.application.name=week04
server.address=127.0.0.1
server.port=${PORT:8080}

# 기본 실행은 파일 DB를 사용하므로 서버를 재시작해도 데이터가 유지됩니다.
spring.datasource.url=jdbc:h2:file:./data/week04;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;WRITE_DELAY=0
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# 예외 응답에 SQL, 접속 정보, 요청 비밀번호를 포함하지 않습니다.
server.error.include-message=never
server.error.include-stacktrace=never
